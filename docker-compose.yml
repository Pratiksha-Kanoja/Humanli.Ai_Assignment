services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/humanli_helpdesk
      JWT_SECRET: change_me_in_real_env_change_me
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"

volumes:
  mongo_data:

